[[servers]]
name = "snowflake"
transport = "stdio"
command = "uvx"
args = ["snowflake-labs-mcp", "--service-config-file", "$SNOWFLAKE_MCP_CONFIG_FILE", "--account", "$SNOWFLAKE_ACCOUNT", "--user", "$SNOWFLAKE_USER", "--warehouse", "$SNOWFLAKE_WAREHOUSE", "--private-key-file", "$SNOWFLAKE_PRIVATE_KEY_FILE", "--role", "$SNOWFLAKE_ROLE"]
bridge = { port = 4456 }
gateway_register = true

[[servers]]
name = "drawio"
transport = "stdio"
command = "drawio-mcp"
bridge = { port = 4457 }
gateway_register = true

