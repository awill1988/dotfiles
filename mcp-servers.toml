# tool policy — glob patterns for tools to exclude from the virtual server.
# tools matching any pattern here are discovered but not exposed to clients.
exclude_tools = [
  "*-delete-*",
  "*-create-repository",
  "*-fork-repository",
  "*-merge-pull-request",
]

[[servers]]
name = "github"
transport = "http"
url = "https://api.githubcopilot.com/mcp/"
headers = { Authorization = "Bearer $GITHUB_MCP_PAT" }
command = "github-mcp-server"
env = { GITHUB_MCP_PAT = "$GITHUB_MCP_PAT" }

# bridge ports: 4450+ alpha-sorted (gateway on 4444, 4445-4449 reserved)

[[servers]]
name = "aws"
transport = "stdio"
command = "uvx"
args = ["awslabs.core-mcp-server@latest"]
bridge = { port = 4450 }
gateway_register = true

[[servers]]
name = "aws-docs"
transport = "stdio"
command = "uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]
bridge = { port = 4451 }
gateway_register = true

[[servers]]
name = "opnsense"
transport = "stdio"
command = "npx"
args = ["--yes", "opnsense-mcp-server@latest"]
env = { OPNSENSE_SSH_HOST = "$OPNSENSE_SSH_HOST", OPNSENSE_SSH_PORT = "$OPNSENSE_SSH_PORT", OPNSENSE_SSH_USERNAME = "$OPNSENSE_SSH_USERNAME", OPNSENSE_SSH_KEY_PATH = "$OPNSENSE_SSH_KEY_PATH" }
bridge = { port = 4452 }
gateway_register = true

[[servers]]
name = "postgres"
transport = "stdio"
command = "contextforge-postgres-mcp"
args = ["${POSTGRES_URL:-postgresql://postgres:postgres@localhost:5432/postgres}"]
bridge = { port = 4453 }
gateway_register = true

