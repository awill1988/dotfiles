projects = { "/Users/adam/projects" = { trust_level = "trusted" }, "/home/adam/projects" = { trust_level = "trusted" } }
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
approval_policy = "on-request"
sandbox_mode = "danger-full-access"
project_doc_fallback_filenames = ["CLAUDE.md", "AGY.md"]
check_for_update_on_startup = false
web_search = "live"

[analytics]
enabled = false

[feedback]
enabled = false

[otel]
exporter = "none"
trace_exporter = "none"
metrics_exporter = "none"
log_user_prompt = false
log_agent_responses = false
log_guardian_assessments = false

[cloud]
skills = { enabled = false }

[orchestrator]
skills = { enabled = false }
mcp = { enabled = false }

[tool_suggest]
discoverables = []
disabled_tools = []

[memories]
generate_memories = false
use_memories = false
dedicated_tools = false
disable_on_external_context = true

[features]
code_mode_host = true
apps = false
enable_mcp_apps = false
codex_apps_mcp_2026_07_28 = false
plugins = false
remote_plugin = false
plugin_sharing = false
recommended_plugins = false
tool_suggest = false
skill_search = false
skill_mcp_dependency_install = false
standalone_web_search = true
browser_use = false
browser_use_external = false
in_app_browser = false
computer_use = false
in_app_local_automation = false
in_app_updates = false
image_generation = false
view_image = false
memories = false
external_agent_memory_import = false
chronicle = false
realtime_conversation = false
in_app_dictation = false
analytics_plan_history = false
api_key_model_discovery = false
runtime_metrics = false
agent_message_board = false
auth_elicitation = false
tool_call_mcp_elicitation = false
use_xaa = false
bedrock_setup_wizard = false
network_proxy = false
respect_system_proxy = false
system_proxy_fallback = false
prevent_idle_sleep = false
daemon_auto_start = false

[mcp_servers.contextforge]
command = "mcpgw-wrapper"
args = []

[mcp_servers.drive]
command = "drive-mcp-bridge"
args = []

[mcp_servers.blender]
command = "blender-mcp"
args = []

[mcp_servers.firefox-devtools]
command = "npx"
args = ["-y", "@mozilla/firefox-devtools-mcp@latest", "--viewport", "1280x720", "--toolPreset", "developer", "--outputFile", "/tmp/firefox-devtools-mcp.log"]

[mcp_servers.icon-composer]
enabled = true
command = "npx"
args = ["-y", "--package=icon-composer-mcp@latest", "--call", "node \"$(realpath \"$(which icon-composer-mcp)\")\""]

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true
experimental_use_profile = true

[ui]
enable_animations = false
show_spinner = false
