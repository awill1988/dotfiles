projects = { "/Users/adam/projects" = { trust_level = "trusted" }, "/home/adam/projects" = { trust_level = "trusted" } }
model = "gpt-5.5"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "danger-full-access"
project_doc_fallback_filenames = ["CLAUDE.md", "GEMINI.md"]

[tools]
websearch = true
view_image = true

[features]
rmcp_client = true
apps = false

[mcp_servers.contextforge]
command = "mcpgw-wrapper"
args = []

[mcp_servers.drive]
command = "drive-mcp-bridge"
args = []

[mcp_servers.blender]
command = "blender-mcp"
args = []

[mcp_servers.firefox-devtools]
command = "npx"
args = ["-y", "firefox-devtools-mcp@latest", "--viewport", "1280x720", "--enableScript", "--outputFile", "/tmp/firefox-devtools-mcp.log"]

[mcp_servers.icon-composer]
enabled = true
command = "npx"
args = ["-y", "--package=icon-composer-mcp@1.1.0", "--call", "node \"$(realpath \"$(which icon-composer-mcp)\")\""]

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true
experimental_use_profile = true

[analytics]
enabled = false
