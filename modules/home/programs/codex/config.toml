projects = { "/home/adam/projects" = { trust_level = "trusted" } }
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "danger-full-access"

[tools]
websearch = true

features.web_search_request = true
features.rmcp_client = true

tools.view_image = true

[mcp_servers.github]
url = "https://api.githubcopilot.com/mcp/"
bearer_token_env_var = "GITHUB_PAT_TOKEN"

[mcp_servers.kubernetes]
command = "npx"
args = ["-y", "@manusa/kubernetes-mcp-server"]

[mcp_servers.context7]
url = "https://mcp.context7.com/mcp"
env_http_headers = { CONTEXT7_API_KEY = "CONTEXT7_API_KEY" }

[mcp_servers.opnsense]
command = "npx"
args = ["--yes", "opnsense-mcp-server@latest"]
env = { OPNSENSE_SSH_HOST = "OPNSENSE_SSH_HOST", OPNSENSE_SSH_PORT = "OPNSENSE_SSH_PORT", OPNSENSE_SSH_USERNAME = "OPNSENSE_SSH_USERNAME", OPNSENSE_SSH_KEY_PATH = "OPNSENSE_SSH_KEY_PATH" }

[mcp_servers.slack]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-slack"]
env = { "SLACK_BOT_TOKEN" = "$SLACK_BOT_TOKEN", "SLACK_TEAM_ID" = "$SLACK_TEAM_ID", "SLACK_CHANNEL_IDS" = "$SLACK_CHANNEL_IDS" }

[shell_environment_policy]
inherit = "all"
ignore_default_excludes = true
experimental_use_profile = true
